name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e . "ruff>=0.15"
      - run: ruff check src tests tools
      - run: ruff format --check src tests tools

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e . "pytest>=8"
      - run: python -m pytest -q
      - run: python -m pytest -q tests/test_roadmap_rows.py
      # Asserts stripped: a wire path guarded by assert is unguarded in production.
      - run: python -O -m pytest -q
